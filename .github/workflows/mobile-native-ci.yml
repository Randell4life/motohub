name: MotoHub quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'database/migrations/**'
      - 'config/**'
      - 'tests/**'
      - 'motohub-mobile/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/mobile-native-ci.yml'
  push:
    branches: [main, feature/mobile-native-integration, feature/motohub-hardening-visual-refresh]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: |
          find app routes database/migrations config tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  laravel-tests:
    name: Laravel feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip, gd, curl, xml
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Run Laravel tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  mobile-build:
    name: MotoHub mobile production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motohub-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motohub-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build mobile frontend
        run: npm run build
