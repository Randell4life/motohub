name: PHP syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/motohub-five-stage-upgrade]

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          find app routes database/migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check whitespace errors
        run: git diff --check
